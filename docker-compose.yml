# OpenClaw Cron Dashboard — example Docker Compose configuration
#
# Usage:
#   1. Copy this file to your working directory
#   2. Adjust the volume mounts to point to your ~/.openclaw directories
#   3. Run: docker compose up -d
#
# The dashboard will be available at http://localhost:3000

services:
  cron-dashboard:
    image: ghcr.io/manos/openclaw-cron-dashboard:latest
    # Or build locally:
    # build: .
    container_name: openclaw-cron-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Path inside the container where the OpenClaw cron directory is mounted
      OPENCLAW_CRON_DIR: /data/cron

      # Path inside the container where the OpenClaw SQLite state DB is mounted.
      # The dashboard reads job list and run history directly from SQLite
      # (no token, no API, no binary required).
      OPENCLAW_STATE_DB: /data/state/openclaw.sqlite

      PORT: "3000"
    volumes:
      # Mount your OpenClaw cron directory (read-only)
      # Used for backward compatibility; the state DB is preferred when present
      - ${HOME}/.openclaw/cron:/data/cron:ro

      # Mount your OpenClaw state directory (read-only)
      # Contains openclaw.sqlite with jobs and run history
      - ${HOME}/.openclaw/state:/data/state:ro

    # Resource limits (optional, adjust to taste)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 128M
